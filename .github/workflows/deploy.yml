name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API and Worker tests
        run: npm test
      - name: Build
        env:
          VITE_DEEPSEEK_API_PROXY_URL: ${{ vars.DEEPSEEK_API_PROXY_URL }}
          VITE_APIMART_IMAGE_MODEL: ${{ vars.APIMART_IMAGE_MODEL }}
          VITE_APIMART_IMAGE_SIZE: ${{ vars.APIMART_IMAGE_SIZE }}
          VITE_APIMART_IMAGE_RESOLUTION: ${{ vars.APIMART_IMAGE_RESOLUTION }}
          VITE_IMAGE_API_PROXY_URL: ${{ vars.IMAGE_API_PROXY_URL }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
